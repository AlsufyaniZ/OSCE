<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSCE 2026 – Rapid Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--ink:#1d1f23;--muted:#6b6f78;--line:#e4e2dc;
  --sx:#b5487a;--si:#0f8a8a;--ddx:#7a4fd6;--inv:#1f7ac2;--mgmt:#1c8a5a;--comp:#c2412d;--pearl:#b07a10;
  --chip:#efede7;--accent:#2b2f36;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15171a;--card:#1e2125;--ink:#ecebe7;--muted:#9a9ea6;--line:#2e3238;
  --sx:#e889b3;--si:#4cc6c6;--ddx:#a98af0;--inv:#62aee8;--mgmt:#4cc28d;--comp:#ef7a66;--pearl:#e0b04a;--chip:#272a30;--accent:#ecebe7;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 10px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font:500 12.5px 'Noto Kufi Arabic',sans-serif;color:var(--muted);margin-top:2px}
.grow{flex:1}
input[type=search]{width:260px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:9px;font:500 13px Inter;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.progress{font-size:13px;color:var(--muted)}
.chips{max-width:1180px;margin:10px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--chip);color:var(--ink);padding:5px 11px;border-radius:999px;font:500 12.5px Inter;cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:220px 1fr;gap:24px}
nav{position:sticky;top:190px;align-self:start;max-height:calc(100vh - 210px);overflow:auto;font-size:13px}
nav a{display:flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:6px}
nav a:hover{background:var(--chip);color:var(--ink)}
nav a.done{color:var(--mgmt)}
nav a.done::after{content:"✓";margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px}
.card>summary::-webkit-details-marker{display:none}
.num{font:600 12px Inter;color:var(--muted);width:22px}
.name{font-weight:700;font-size:16.5px}
.sys{font-size:11.5px;color:var(--muted);background:var(--chip);padding:2px 8px;border-radius:999px}
.caret{margin-left:auto;color:var(--muted);transition:transform .15s}
.card[open] .caret{transform:rotate(90deg)}
.body{padding:0 18px 16px;border-top:1px solid var(--line)}
.pearl{margin:14px 0 4px;padding:10px 12px;border-left:3px solid var(--pearl);background:color-mix(in srgb,var(--pearl) 9%,transparent);border-radius:0 8px 8px 0;font-size:13.5px}
.pearl b{color:var(--pearl)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:12px}
.sec h3{margin:6px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sec.sx h3{color:var(--sx)}.sec.si h3{color:var(--si)}.sec.ddx h3{color:var(--ddx)}.sec.inv h3{color:var(--inv)}.sec.mgmt h3{color:var(--mgmt)}.sec.comp h3{color:var(--comp)}
.sec ul{margin:0;padding-left:18px}
.sec li{margin:2px 0}
.sec li::marker{color:var(--muted)}
.sub{font-weight:600}
.mark{display:flex;justify-content:flex-end;margin-top:10px}
.mark label{font-size:13px;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
mark{background:color-mix(in srgb,var(--pearl) 35%,transparent);color:inherit;border-radius:2px}
.empty{color:var(--muted);padding:30px;text-align:center}
.note{font-size:12px;color:var(--muted);margin-top:22px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}nav{display:none}.grid{grid-template-columns:1fr}input[type=search]{width:100%}}

[hidden]{display:none!important}
.tpbox{margin:14px 0 8px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--inv) 9%,transparent);border:1px solid color-mix(in srgb,var(--inv) 25%,transparent)}
.tpbox b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--inv)}
.tpbox p{margin:4px 0 0;font-size:14.5px;font-style:italic}
.pearl{font-size:12.5px!important;padding:7px 12px!important;margin:6px 0 4px!important;opacity:.9}
.epbox{margin-top:14px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--pearl) 12%,transparent);border:1px solid color-mix(in srgb,var(--pearl) 35%,transparent)}
.epbox b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pearl)}
.lnk{margin-top:12px;border:1px solid var(--line,#ddd);border-radius:10px;padding:0}
.lnk>summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
.lnk>summary::-webkit-details-marker{display:none}
.lnk .lc{background:var(--accent,#2563eb);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.lnk ul{margin:0;padding:4px 14px 6px 14px;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px}
.lnk li a{display:block;padding:6px 8px;border-radius:8px;text-decoration:none;color:inherit;font-size:13.5px}
.lnk li a:hover{background:color-mix(in srgb,var(--accent,#2563eb) 10%,transparent)}
.lnk .lnote{margin:0;padding:0 14px 10px;font-size:11.5px;opacity:.65}
@media (max-width:860px){.lnk ul{grid-template-columns:1fr}.lnk li a{padding:9px 8px;font-size:14.5px}}
.epbox ul{margin:6px 0 0;padding-left:18px}.epbox li{margin:3px 0}

.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:10px}
.tab{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font:600 13px Inter}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips+.chips{margin-top:6px}
.chip.src{background:transparent;border:1px solid var(--line)}
.chip.src.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.srcb{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:999px;white-space:nowrap}
.swrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.sintro{font:500 14px 'Noto Kufi Arabic',Inter,sans-serif;color:var(--muted);direction:rtl;text-align:right;margin:0 0 14px}
.sintro span{font-family:Inter;direction:ltr;display:inline-block;margin-right:8px;color:var(--ink)}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:12px;break-inside:avoid}
.sgroup h2{font-size:14px;margin:4px 0 8px;display:flex;justify-content:space-between}
.sgroup h2 span{font-weight:500;color:var(--muted);font-size:12.5px}
.scols{columns:2;column-gap:28px}
.sitem{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px;cursor:pointer;break-inside:avoid}
.sitem input{margin-top:3px;accent-color:var(--mgmt)}
.sitem.ok span{color:var(--muted);text-decoration:line-through}
@media(max-width:860px){.scols{columns:1}}

.srow{display:flex;gap:8px;align-items:center}
.acts{display:flex;gap:8px;align-items:center}
.fbtn{display:none}
#totop{display:none;position:fixed;right:14px;bottom:18px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#totop.show{display:block}
@media(max-width:860px){
  body{font-size:15.5px}
  header{padding:8px 12px 8px}
  .top{gap:8px}
  h1{font-size:16px;flex:1}
  h1 small{display:none}
  .tabs{order:2}
  .tab{padding:6px 10px}
  .grow{display:none}
  .srow{order:3;width:100%}
  .srow input[type=search]{flex:1;width:auto;padding:10px 12px;font-size:16px}
  .fbtn{display:inline-block;padding:10px 12px;white-space:nowrap}
  .fbtn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .acts{order:4;width:100%;display:none;justify-content:space-between}
  #fpanel{display:none}
  header.fopen .acts{display:flex}
  header.fopen #fpanel{display:block}
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:8px -12px 0;padding:0 12px 2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;font-size:13px}
  .wrap{padding:10px 8px 70px;gap:0}
  .card{border-radius:12px;margin-bottom:10px;scroll-margin-top:120px}
  .card>summary{padding:13px 12px;gap:8px;flex-wrap:wrap}
  .num{width:auto}
  .name{font-size:16px;flex:1 1 calc(100% - 64px)}
  .sys{order:3;margin-left:22px}
  .caret{order:2}
  .body{padding:0 12px 14px}
  .tpbox,.epbox{padding:10px 12px}
  .tpbox p{font-size:15px}
  .sec h3{font-size:12.5px;margin-top:12px}
  .sec ul{padding-left:18px}
  .sec li{margin:4px 0;line-height:1.45}
  .grid{gap:0}
  .mark label{font-size:15px;padding:8px 0}
  .mark input{width:20px;height:20px}
  .swrap{padding:10px 8px 70px}
  .sgroup{padding:12px}
  .sitem{font-size:15px;padding:7px 0}
  .sitem input{width:20px;height:20px;flex:0 0 20px}
  .sintro{font-size:13px}
}

.modes{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mode{flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 10px;border-radius:12px;font:600 14px Inter;cursor:pointer}
.mode.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;max-width:820px}
.scard h2{margin:0 0 6px;font-size:19px}.scard h2 small{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}.row.end{justify-content:flex-end}
.sel{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.big{padding:12px 18px;font-size:15px;width:100%;margin-top:6px}
.btn[disabled]{opacity:.5}
a.btn{text-decoration:none;display:inline-block}
.sthead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 9px;border-radius:999px}
.clock{font:700 20px Inter;font-variant-numeric:tabular-nums}.clock.warn{color:var(--comp)}
.q1{margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dxans{font-weight:700;font-size:17px;color:var(--mgmt);width:100%;margin:4px 0}
.ostep{border-top:1px solid var(--line);padding:10px 0}
.oq{margin:4px 0 8px}
.oans h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--inv);margin:4px 0}
.oans ul,.fback ul{margin:4px 0;padding-left:18px}.oans li,.fback li{margin:3px 0}
.rate,.rate4{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.rate span{font-size:13px;color:var(--muted);margin-right:4px}
.r{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 12px;font:600 13px Inter;cursor:pointer}
.r.good{border-color:var(--mgmt);color:var(--mgmt)}.r.mid{border-color:var(--pearl);color:var(--pearl)}.r.bad{border-color:var(--comp);color:var(--comp)}.r.easy{border-color:var(--inv);color:var(--inv)}
.r.sel{color:var(--bg)!important}.r.good.sel{background:var(--mgmt)}.r.mid.sel{background:var(--pearl)}.r.bad.sel{background:var(--comp)}
.rate4 .r{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 6px}.rate4 small{font-weight:400;opacity:.8;font-size:11px}
.result h2{font-size:28px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats3 div{background:var(--chip);border-radius:10px;padding:10px;text-align:center}.stats3 b{display:block;font-size:22px}.stats3 span{font-size:12px;color:var(--muted)}
.types{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tchip{font-size:13px;background:var(--chip);padding:6px 10px;border-radius:999px;display:flex;gap:5px;align-items:center;cursor:pointer}
.fcard .fside{min-height:120px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 4px}
.fq{font-weight:700;font-size:18px;margin:4px 0}.fsec{font-size:16px;color:var(--inv);font-weight:600;margin:2px 0}.fscen{font-style:italic;font-size:15.5px}
.fback{background:var(--chip);border-radius:10px;padding:10px 14px;margin:8px 0}
.qtext{font-size:16px;margin:8px 0 12px;line-height:1.5}.qlab{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--inv);margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.right{border-color:var(--mgmt);background:color-mix(in srgb,var(--mgmt) 14%,transparent)}
.opt.wrong{border-color:var(--comp);background:color-mix(in srgb,var(--comp) 14%,transparent)}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}.fb.ok{background:color-mix(in srgb,var(--mgmt) 12%,transparent)}.fb.no{background:color-mix(in srgb,var(--comp) 12%,transparent)}
.fbmore{margin-top:6px;color:var(--muted);font-size:13px}
.wlist a{color:var(--inv)}
@media(max-width:860px){h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.scard{padding:14px 12px}.mode{font-size:13px;padding:10px 6px;min-width:0}.tab{padding:6px 8px;font-size:12.5px}.btn.big{font-size:16px}}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1>OSCE 2026 – Rapid Review<small>مراجعة سريعة: الأمراض + قائمة المهارات</small></h1>
    <div class="tabs"><a href="#diseases" class="tab" data-t="diseases">Diseases</a><a href="#study" class="tab" data-t="study">Study</a><a href="#skills" class="tab" data-t="skills">Skills</a></div>
    <div class="grow"></div>
    <div class="srow"><input type="search" id="q" placeholder="Search disease, drug, sign…"><button class="btn fbtn" id="ftoggle" aria-expanded="false">Filters</button></div>
    <div class="acts"><button class="btn" id="exp">Expand all</button><button class="btn" id="col">Collapse all</button><span class="progress" id="prog"></span></div>
  </div>
  <div id="fpanel">
    <div class="chips" id="src"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<button id="totop" aria-label="Back to top">↑</button>
<div class="wrap" id="dview">
  <nav id="nav"></nav>
  <main id="list"></main>
</div>
<div class="swrap" id="study" hidden></div>
<div class="swrap" id="sview" hidden>
  <p class="sintro">قائمة تأكد فقط: علّم على كل مهارة بعد ما تراجعها. <span id="sprog"></span></p>
  <div id="slist"></div>
</div>

<script src="data/d0.js"></script>
<script src="data/d1.js"></script>
<script src="data/d2.js"></script>
<script src="data/d3.js"></script>
<script src="data/d4.js"></script>
<script src="data/d5.js"></script>
<script src="data/d6.js"></script>
<script src="data/d7.js"></script>
<script src="data/d8.js"></script>
<script src="data/d9.js"></script>
<script src="data/ss1.js"></script>
<script src="data/ss2.js"></script>
<script src="data/tp1.js"></script>
<script src="data/tp2.js"></script>
<script src="data/ep1.js"></script>
<script src="data/ep2.js"></script>
<script src="data/ep3.js"></script>
<script src="data/ep4.js"></script>
<script src="data/skills.js"></script>
<script src="data/links.js"></script>
<script src="data/as.js"></script>
<script src="app.js"></script>
<script src="study.js"></script>
<style>.card{scroll-margin-top:200px}</style>
</body>
</html>
